<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: oklch(0.14 0.01 260);
      --foreground: oklch(0.97 0.005 250);
      --card: oklch(0.18 0.012 260);
      --card-foreground: oklch(0.97 0.005 250);
      --muted: oklch(0.22 0.014 260);
      --muted-foreground: oklch(0.66 0.02 260);
      --accent: oklch(0.24 0.016 260);
      --accent-foreground: oklch(0.97 0.005 250);
      --border: oklch(1 0 0 / 8%);
      --input: oklch(1 0 0 / 10%);
      --ring: oklch(0.7 0.02 260);
      --gold: oklch(0.85 0.17 85);
      --silver: oklch(0.85 0.01 260);
      --bronze: oklch(0.72 0.14 55);
      --shadow-elegant: 0 1px 2px 0 color-mix(in oklab, var(--foreground) 5%, transparent), 0 12px 40px -12px color-mix(in oklab, var(--foreground) 12%, transparent);
      color-scheme: dark;
    }
    * { box-sizing: border-box; border-color: var(--border); }
    html, body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--background);
      color: var(--foreground);
      font-family: "Pixelify Sans", "VT323", monospace, ui-monospace, "Courier New", Courier, monospace;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      text-rendering: optimizeSpeed;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .ranking-page { width: 100%; max-width: 56rem; margin: 0 auto; padding: 2rem 1rem; }
    @media (min-width: 640px) { .ranking-page { padding: 3.5rem 1.5rem; } }
    .ranking-header { text-align: center; margin-bottom: 2.5rem; }
    .ranking-header-icon { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 1rem; border-radius: 1rem; background: var(--foreground); color: var(--background); font-size: 1.25rem; }
    .ranking-page-title { margin: 0; font-size: 1.875rem; font-weight: 600; letter-spacing: -0.02em; }
    @media (min-width: 640px) { .ranking-page-title { font-size: 2.25rem; } }
    .ranking-page-subtitle { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--muted-foreground); }
    .ranking-table-wrap { overflow: hidden; border-radius: 1rem; border: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow-elegant); }
    .ranking-table-header { display: grid; grid-template-columns: 60px 80px 1fr 80px; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); }
    .ranking-table-header-right { text-align: right; }
    .ranking-row { display: grid; grid-template-columns: 60px 80px 1fr 80px; align-items: center; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid color-mix(in oklab, var(--border) 50%, transparent); }
    .ranking-row:last-child { border-bottom: none; }
    .ranking-row-podium { background: color-mix(in oklab, var(--accent) 30%, transparent); }
    .ranking-rank { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ranking-rank-num.muted { color: var(--muted-foreground); }
    .ranking-cover-cell { width: 56px; height: 56px; overflow: hidden; border-radius: 8px; }
    .ranking-cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ranking-info-cell { min-width: 0; }
    .ranking-game-name { margin: 0; font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ranking-score-cell { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ranking-empty { text-align: center; padding: 3rem; }
    .ranking-empty p { margin: 0 0 1.5rem; color: var(--muted-foreground); }
    .ranking-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 2rem; }
    .ranking-btn { display: inline-flex; align-items: center; gap: 0.375rem; height: 44px; padding: 0 1.25rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 500; font-family: inherit; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .ranking-btn-outline { border: 1px solid var(--border); background: transparent; color: var(--foreground); }
    .ranking-btn-outline:hover { background: var(--accent); }

    @media (max-width: 640px) {
      .ranking-page { padding: 1rem 0.5rem; }
      .ranking-table-wrap { border-radius: 0; margin: 0 -0.5rem; }
      .ranking-table-header, .ranking-row { grid-template-columns: 40px 56px 1fr 56px; padding: 0.5rem 0.75rem; gap: 0.5rem; }
      .ranking-cover-cell { width: 40px; height: 40px; }
      .ranking-game-name { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="ranking-empty"><p>Loading...</p></div>
  </div>
  <script>
    function decodeRankingData(raw) {
      try {
        var parsed = JSON.parse(decodeURIComponent(raw));
        if (parsed.v !== 1 || !Array.isArray(parsed.g)) return null;
        return parsed.g.map(function (g) { return { title: g[0], thumbnail: g[1] || "", count: g[2] || 0 }; });
      } catch (e) { return null; }
    }
    function getMedal(index) {
      if (index === 0) return "&#x1F947;";
      if (index === 1) return "&#x1F948;";
      if (index === 2) return "&#x1F949;";
      return "#" + (index + 1);
    }
    function renderRankRow(entry, index) {
      var name = entry.title || "Unknown";
      var score = entry.count || 0;
      var thumb = entry.thumbnail || "";
      var hash = name.split("").reduce(function (acc, c) { return acc + c.charCodeAt(0); }, 0);
      var hue = hash % 360;
      var coverColor = "oklch(0.2 0.04 " + hue + ")";
      var isPodium = index < 3;
      var cls = "ranking-row" + (isPodium ? " ranking-row-podium" : "");
      var imgHtml = thumb
        ? '<img src="' + thumb.replace(/"/g, "&quot;") + '" alt="' + name.replace(/"/g, "&quot;") + '" class="ranking-cover-img" referrerpolicy="no-referrer" />'
        : '<div class="ranking-cover-img" style="background:' + coverColor + ';display:flex;align-items:center;justify-content:center;color:oklch(0.7 0.15 ' + hue + ');font-size:1.2rem;font-weight:700;">' + name.charAt(0).toUpperCase() + '</div>';
      return '<div class="' + cls + '"><div class="ranking-rank"><span class="ranking-rank-num' + (isPodium ? "" : " muted") + '">' + getMedal(index) + '</span></div><div class="ranking-cover-cell">' + imgHtml + '</div><div class="ranking-info-cell"><p class="ranking-game-name">' + name + '</p></div><div class="ranking-score-cell">' + score + '</div></div>';
    }
    function render(ranking) {
      var html = '<div class="ranking-page"><div class="ranking-header"><div class="ranking-header-icon">&#x1F3C6;</div><h1 class="ranking-page-title">Ranking</h1><p class="ranking-page-subtitle">Based on ' + ranking.length + ' games</p></div><div class="ranking-table-wrap"><div class="ranking-table-header"><span>#</span><span>Cover</span><span>Game</span><span class="ranking-table-header-right">Votes</span></div>';
      for (var i = 0; i < ranking.length; i++) {
        html += renderRankRow(ranking[i], i);
      }
      html += '</div><div class="ranking-actions"><a href="/" class="ranking-btn ranking-btn-outline">&#8592; Back to app</a></div></div>';
      return html;
    }
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get("data");
      var root = document.getElementById("root");
      if (!raw) {
        root.innerHTML = '<div class="ranking-empty"><p>Invalid or corrupted ranking link.</p><a href="/" class="ranking-btn ranking-btn-outline">&#8592; Back to app</a></div>';
        return;
      }
      var ranking = decodeRankingData(raw);
      if (!ranking || ranking.length === 0) {
        root.innerHTML = '<div class="ranking-empty"><p>Invalid or corrupted ranking link.</p><a href="/" class="ranking-btn ranking-btn-outline">&#8592; Back to app</a></div>';
        return;
      }
      root.innerHTML = render(ranking);
    })();
  </script>
</body>
</html>
